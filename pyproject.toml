[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noah-ai-portfolio"
version = "0.1.0"
description = "Noah Wang's interactive backend and AI integration portfolio for prospective Upwork clients."
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "streamlit==1.61.0",
]

[tool.setuptools.packages.find]
include = ["noah_portfolio"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
noah_portfolio = ["frontend/build/**/*", "pyproject.toml"]

[tool.setuptools.exclude-package-data]
noah_portfolio = ["frontend/tests/*", "frontend/tests/**/*"]

[tool.streamlit.component]
[[tool.streamlit.component.components]]
name = "portfolio"
asset_dir = "noah_portfolio/frontend/build"
